<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TitoOS</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #38bdf8; --ok: #4ade80; --warn: #facc15;
    --bad: #f87171; --idle: #a78bfa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header h1 span { color: var(--accent); }
  .stat { color: var(--muted); }
  .stat b { color: var(--text); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; padding: 16px 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  section h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; color: #0f172a; font-weight: 600; }
  .s-ready { background: var(--accent); } .s-running { background: var(--warn); }
  .s-waiting { background: var(--idle); } .s-done { background: var(--ok); }
  .s-failed { background: var(--bad); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input, select { font: inherit; color: var(--text); background: #0b1220; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; background: #0c4a6e; border-color: #0369a1; }
  button:hover { background: #075985; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=number] { width: 80px; }
  form { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; margin-top: 12px; }
  form button { grid-column: 2; justify-self: start; }
  code, pre { font-family: ui-monospace, monospace; font-size: 12px; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  .error { color: var(--bad); }
  #status { min-height: 1.4em; margin-top: 8px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 5px 0; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Tito<span>OS</span></h1>
  <div class="stat">tick <b id="tick">-</b></div>
  <div class="stat">agents <b id="live">-</b></div>
  <div class="stat">stop reason <b id="stop-reason">-</b></div>
  <div class="stat">quiescent <b id="quiescent">-</b></div>
  <div class="stat">backend <b id="backend">-</b></div>
</header>
<main>
  <section aria-labelledby="controls-h">
    <h2 id="controls-h">Controls</h2>
    <div class="controls">
      <button id="step" type="button">Step</button>
      <label>ticks <input id="max-ticks" type="number" min="0" max="10000" value="100"></label>
      <button id="run" type="button">Run</button>
      <button id="refresh" type="button">Refresh</button>
      <label><input id="auto" type="checkbox" checked> auto-refresh</label>
    </div>
    <form id="send-form">
      <label for="send-to">To</label>
      <select id="send-to"></select>
      <label for="send-payload">Payload</label>
      <input id="send-payload" placeholder='text, or JSON such as {"job": 1}'>
      <button type="submit">Send message</button>
    </form>
    <div id="status" role="status"></div>
  </section>

  <section aria-labelledby="agents-h">
    <h2 id="agents-h">Agents</h2>
    <table>
      <thead><tr><th>Name</th><th>Kind</th><th>State</th><th>Parent</th><th class="num">Restarts</th><th class="num">Pending</th></tr></thead>
      <tbody id="agents"></tbody>
    </table>
  </section>

  <section aria-labelledby="mail-h">
    <h2 id="mail-h">Mailboxes</h2>
    <ul class="list" id="mailboxes"></ul>
  </section>

  <section aria-labelledby="reports-h">
    <h2 id="reports-h">Tick reports</h2>
    <table>
      <thead><tr><th class="num">Tick</th><th>Ran</th><th>Waiting</th><th>Failed</th><th>Restarted</th></tr></thead>
      <tbody id="reports"></tbody>
    </table>
  </section>

  <section aria-labelledby="errors-h">
    <h2 id="errors-h">Errors</h2>
    <ul class="list" id="errors"></ul>
  </section>

  <section aria-labelledby="integrations-h">
    <h2 id="integrations-h">Integrations</h2>
    <ul class="list" id="integrations"></ul>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (cls) node.className = cls;
  return node;
}

function fill(target, nodes, emptyText, emptyTag) {
  target.replaceChildren(...nodes);
  if (!nodes.length) {
    const tag = emptyTag || "li";
    const empty = el(tag, null, "empty");
    if (tag === "tr") {
      const cell = el("td", emptyText);
      cell.colSpan = 6;
      empty.append(cell);
    } else {
      empty.textContent = emptyText;
    }
    target.append(empty);
  }
}

function show(text, isError) {
  const status = $("status");
  status.textContent = text;
  status.className = isError ? "error" : "muted";
}

async function api(method, path, body) {
  const init = { method, headers: {} };
  if (method === "POST") {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body || {});
  }
  const response = await fetch(path, init);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function names(list) { return list.length ? list.join(", ") : "-"; }

function render(state) {
  $("tick").textContent = state.tick;
  const live = state.agents.filter((a) => a.alive).length;
  $("live").textContent = `${live}/${state.agents.length} live`;
  $("stop-reason").textContent = state.stop_reason || "-";
  $("quiescent").textContent = state.quiescent ? "yes" : "no";
  $("backend").textContent = state.backend;

  fill($("agents"), state.agents.map((a) => {
    const row = el("tr");
    row.dataset.agent = a.name;
    const stateCell = el("td");
    stateCell.append(el("span", a.state, `badge s-${a.state}`));
    row.append(el("td", a.name), el("td", a.kind, "muted"), stateCell,
      el("td", a.parent || "-", "muted"), el("td", a.restarts, "num"), el("td", a.pending, "num"));
    return row;
  }), "No agents registered.", "tr");

  fill($("mailboxes"), Object.entries(state.mailboxes).filter(([, box]) => box.count).map(([name, box]) => {
    const item = el("li");
    item.append(el("b", name), el("span", ` - ${box.count} pending`, "muted"));
    for (const m of box.messages) {
      item.append(el("pre", `${m.sender} -> ${m.to}: ${JSON.stringify(m.payload)}`));
    }
    if (box.count > box.messages.length) item.append(el("div", `... ${box.count - box.messages.length} more`, "muted"));
    return item;
  }), "All mailboxes are empty.");

  fill($("reports"), state.reports.map((r) => {
    const row = el("tr");
    row.append(el("td", r.tick, "num"), el("td", names(r.ran)), el("td", names(r.waiting), "muted"),
      el("td", names(r.failed), r.failed.length ? "error" : ""), el("td", names(r.restarted)));
    return row;
  }), "No ticks run from this GUI yet.", "tr");

  fill($("errors"), state.errors.map((e) => {
    const item = el("li");
    item.append(el("b", e.agent), el("span", ` ${e.type}: `, "error"), el("span", e.error));
    return item;
  }), "No errors.");

  fill($("integrations"), state.integrations.map((name) => el("li", name)), "None installed.");

  const select = $("send-to");
  const current = select.value;
  const options = [el("option", "* (broadcast)")];
  options[0].value = "*";
  for (const a of state.agents.filter((a) => a.alive)) {
    const option = el("option", a.name);
    option.value = a.name;
    options.push(option);
  }
  select.replaceChildren(...options);
  if ([...select.options].some((o) => o.value === current)) select.value = current;
}

async function refresh() {
  try {
    render(await api("GET", "/api/state"));
  } catch (err) {
    show(`Refresh failed: ${err.message}`, true);
  }
}

async function action(button, fn) {
  button.disabled = true;
  try {
    show(await fn(), false);
  } catch (err) {
    show(err.message, true);
  } finally {
    button.disabled = false;
    await refresh();
  }
}

$("step").addEventListener("click", () => action($("step"), async () => {
  const r = await api("POST", "/api/step");
  return `Tick ${r.tick}: ran ${names(r.ran)}`;
}));

$("run").addEventListener("click", () => action($("run"), async () => {
  const r = await api("POST", "/api/run", { max_ticks: Number($("max-ticks").value) });
  return `Ran ${r.reports.length} tick(s); stop reason: ${r.stop_reason}`;
}));

$("refresh").addEventListener("click", refresh);

$("send-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const button = event.submitter || $("send-form").querySelector("button");
  action(button, async () => {
    const raw = $("send-payload").value;
    let payload = raw;
    try { payload = JSON.parse(raw); } catch (_) { /* plain text */ }
    const m = await api("POST", "/api/send", { to: $("send-to").value, payload });
    $("send-payload").value = "";
    return `Sent ${JSON.stringify(m.payload)} to ${m.to}`;
  });
});

setInterval(() => { if ($("auto").checked) refresh(); }, 2000);
refresh();
</script>
</body>
</html>
